name: Feed Health Monitor

on:
  schedule:
    # Runs every 4 hours (at minute 0)
    - cron: '0 */4 * * *'
  # Allows manual test trigger from GitHub UI
  workflow_dispatch:

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Feed Health Checker
        env:
          # Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to your GitHub repo secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Or DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-feed-health.mjs
