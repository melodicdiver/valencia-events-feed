name: Micalet Push Notifications (FCM Topics)

on:
  schedule:
    # Morning brief: 09:30 Europe/Madrid (fires at 07:30 & 08:30 UTC; --check-schedule picks the exact Madrid hour across CET/CEST)
    - cron: '30 7,8 * * *'
    # Weekend digest: Thursday 18:00 Europe/Madrid (fires at 16:00 & 17:00 UTC Thu; --check-schedule picks the exact Madrid hour)
    - cron: '0 16,17 * * 4'
    # Weather alerts: every 2 hours (quiet-hours aware & 12h deduplicated)
    - cron: '15 */2 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Notification mode to send'
        required: true
        default: 'weekend'
        type: choice
        options:
          - weekend
          - weather_alerts
          - morning_brief
      dry_run:
        description: 'Dry run (log payloads without sending to FCM)'
        required: false
        default: true
        type: boolean

jobs:
  dispatch-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore weather alert deduplication cache
        uses: actions/cache@v4
        with:
          path: .push-alert-state.json
          key: push-alert-state-${{ github.run_id }}
          restore-keys: |
            push-alert-state-

      - name: Determine mode and dispatch push notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_FLAG=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_FLAG="--dry-run"
            fi
            node scripts/push/send-push.mjs --mode=${{ inputs.mode }} $DRY_FLAG --state-file=.push-alert-state.json
          else
            case "${{ github.event.schedule }}" in
              "30 7,8 * * *")
                node scripts/push/send-push.mjs --mode=morning_brief --check-schedule
                ;;
              "0 16,17 * * 4")
                node scripts/push/send-push.mjs --mode=weekend --check-schedule
                ;;
              "15 */2 * * *")
                node scripts/push/send-push.mjs --mode=weather_alerts --state-file=.push-alert-state.json
                ;;
            esac
          fi
